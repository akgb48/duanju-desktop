name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            go.sum
            tools/appresources/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 解析版本
        id: version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:REQUESTED_VERSION
          if (-not $version) { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw '无效的发布版本号' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "file=DuanjuDesktop-$version-windows-amd64.exe" >> $env:GITHUB_OUTPUT

      - name: 检查并构建
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_FILE: ${{ steps.version.outputs.file }}
        run: ./Build.ps1 -Version $env:RELEASE_VERSION -OutputPath "dist/$env:RELEASE_FILE"

      - name: 计算摘要
        shell: pwsh
        env:
          RELEASE_FILE: ${{ steps.version.outputs.file }}
        run: |
          $hash = (Get-FileHash -LiteralPath "dist/$env:RELEASE_FILE" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $env:RELEASE_FILE" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8
          "SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/${{ steps.version.outputs.file }}
            dist/SHA256SUMS.txt
