name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: 检查与 Windows 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            go.sum
            tools/appresources/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: 检查 Go 格式
        shell: pwsh
        run: |
          $files = @(gofmt -l main.go internal pkg cmd tools/appresources)
          if ($files.Count -gt 0) { throw "请格式化以下文件：$($files -join ', ')" }

      - name: 资源、接口、测试与 EXE
        shell: pwsh
        run: ./Build.ps1

      - name: 竞态检测
        env:
          CGO_ENABLED: '1'
        run: go test -race ./internal/... ./pkg/... -count=1

      - uses: actions/upload-artifact@v7
        with:
          name: duanju-desktop-windows-amd64
          path: dist/短剧电脑版.exe
          retention-days: 14

  vuln:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    # 先以观察模式接入：发现漏洞时只报告，不阻塞主构建。
    # 稳定后可将 continue-on-error 去掉，改为强制门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            go.sum
            tools/appresources/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # main.go 用 //go:embed all:frontend/dist 嵌入界面产物，该目录不入库。
      # 缺少它时 go list / 扫描在加载包阶段就会失败，因此必须先构建界面资源。
      - name: 生成前端嵌入资源
        run: node scripts/build-frontend.mjs
      - name: 漏洞扫描
        # 固定版本，避免 @latest 漂移：v1.8.0 起要求 Go 1.26，而项目 go.mod 为 1.25。
        # 升级此版本时需同步调整上方 setup-go 的 go-version。
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend-lint:
    name: 前端规范检查
    runs-on: ubuntu-latest
    # 规则目前以警告为主，先接入观察，稳定后再改为强制门禁。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: ESLint
        working-directory: frontend
        run: npm run lint
