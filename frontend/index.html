<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- WebView2 环境：禁止页面自身发起外部请求，所有网络都经 Go 侧 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob:; img-src 'self' data: blob: http: https:; media-src 'self' data: blob: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob:; worker-src 'self' blob:; connect-src 'self' data: blob: http: https: ws:"
    />
    <title>短剧电脑版</title>
  </head>
  <body>
    <!-- Wails 窗口为无边框模式，根节点铺满整个视口 -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
